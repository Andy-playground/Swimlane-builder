name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# A release published in the GitHub web UI can also push its new tag, so two runs may
# start for one version. They run one at a time, and the second only re-uploads.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import swimlane_builder; print(swimlane_builder.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - name: Full suite
        run: python tests/test_all.py
      - name: Build the Skill bundle
        run: |
          python tools/build_skill.py -o dist/swimlane-builder-skill.zip
          (cd dist && sha256sum swimlane-builder-skill.zip > swimlane-builder-skill.zip.sha256)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(cut -d' ' -f1 dist/swimlane-builder-skill.zip.sha256)
          cat > notes.md <<EOF
          Turn an SOP into a deterministic draw.io swimlane diagram.

          ## Downloads

          | File | What it is |
          |---|---|
          | \`swimlane-builder-skill.zip\` | The portable AI Skill. Upload it to Claude as a Skill, or unzip it as context files for another agent. |
          | \`swimlane-builder-skill.zip.sha256\` | The checksum of the zip. |
          | \`swimlane-builder-showreel.mp4\` | A 30-second overview of the tool, with sound. |

          The zip is built deterministically: the same tag always gives the same bytes.

          SHA-256: \`$sha\`

          ## Run it from source

          \`\`\`bash
          git clone https://github.com/$REPO.git
          cd $(basename "$REPO")
          python3 swimlane-builder.py generate examples/po-confirmation.spec.json -o out.drawio
          \`\`\`

          Python 3.11 or later. No dependencies.
          EOF
          assets="dist/swimlane-builder-skill.zip dist/swimlane-builder-skill.zip.sha256 docs/media/swimlane-builder-showreel.mp4"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # published from the web UI: attach the files and fill in the notes
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
            gh release edit "$GITHUB_REF_NAME" --title "swimlane-builder $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" $assets \
              --title "swimlane-builder $GITHUB_REF_NAME" --notes-file notes.md
          fi
